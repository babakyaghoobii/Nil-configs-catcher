name: Publish NIL Proxy Web App to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'vite.config.ts'
      - '.github/workflows/nil-web-pwa-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nil-proxy-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate icons
        run: npm run icons
      - name: Build Safari-compatible web app
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Safari entrypoint is publicly accessible
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$SITE_URL"
          for i in $(seq 1 12); do
            if curl --fail --location --silent --show-error --max-time 15 "${SITE_URL%/}/proxy/" -o /tmp/nil-proxy-page.html && grep -q 'NIL Proxy — Smart Configs Hub' /tmp/nil-proxy-page.html; then
              echo "Verified deployed NIL Proxy at ${SITE_URL%/}/proxy/"
              exit 0
            fi
            sleep 10
          done
          echo 'ERROR: NIL Proxy Safari entrypoint is not publicly accessible or wrong content was served.' >&2
          exit 1
