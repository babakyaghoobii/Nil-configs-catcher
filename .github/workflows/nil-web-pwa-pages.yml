name: Publish NIL Proxy Web App to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate icons
        run: npm run icons
      - name: Build Safari-compatible web app
        run: npm run build
      - name: Install NIL Proxy iPhone icon in its own app directory
        run: |
          test -s public/icons/apple-touch-icon.png
          test -s dist/proxy/index.html
          mkdir -p dist/proxy
          cp public/icons/apple-touch-icon.png dist/proxy/apple-touch-icon.png
          cp public/icons/icon-192.png dist/proxy/icon-192.png
          cp public/icons/icon-512.png dist/proxy/icon-512.png
          cp public/icons/maskable-512.png dist/proxy/maskable-512.png
          test -s dist/proxy/apple-touch-icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Safari entrypoint is publicly accessible
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$SITE_URL"
          for i in $(seq 1 12); do
            if curl --fail --location --silent --show-error --max-time 15 "${SITE_URL%/}/proxy/" -o /tmp/nil-proxy-page.html && grep -q 'NIL Proxy — Smart Configs Hub' /tmp/nil-proxy-page.html; then
              echo "Verified deployed NIL Proxy at ${SITE_URL%/}/proxy/"
              exit 0
            fi
            sleep 10
          done
          echo 'ERROR: NIL Proxy Safari entrypoint is not publicly accessible or wrong content was served.' >&2
          exit 1
