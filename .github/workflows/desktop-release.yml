name: Build native desktop apps

on:
  push:
    branches: [feat/desktop-installer-and-branding]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate public release prerequisites
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare-release.py "$RELEASE_TAG" --check-only
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run build:desktop
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:desktop-ui

  native:
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            bundles: app
          - os: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            bundles: app
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Linux native libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf desktop-file-utils xvfb dbus-x11
      - name: Pinned Rust toolchain
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 "$RUST_TARGET"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: native-${{ runner.os }}-${{ matrix.target }}-rust1.99.1-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci --ignore-scripts
      - run: npm run desktop:icons
      - name: Compile actual native app
        env:
          RUST_TARGET: ${{ matrix.target }}
          BUNDLE_TYPES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run desktop:build -- --target "$RUST_TARGET" --bundles "$BUNDLE_TYPES" -- --locked
      - name: Verify and package application identity and binaries
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.target }}
        run: python3 scripts/package-desktop.py --platform "$NATIVE_PLATFORM" --arch "$NATIVE_ARCH" --target "$RUST_TARGET"
      - name: Test installation with actual build assets
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_ARCH: ${{ matrix.arch }}
        run: python3 tests/native_install_smoke.py --platform "$NATIVE_PLATFORM" --arch "$NATIVE_ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-files/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: release-files
          merge-multiple: true
      - name: Require creator logo and complete matching packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare-release.py "$RELEASE_TAG"
      - name: Stage, verify, then publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/nil-release.json 2>/dev/null; then
            python3 -c "import json; assert json.load(open('/tmp/nil-release.json'))['isDraft'], 'Published releases are immutable'"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "NIL Config Catcher $RELEASE_TAG" --notes-file docs/desktop-release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-files/* --clobber
          python3 scripts/verify-release.py "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
